name: Keep shared database awake

# Supabase ставит бесплатный проект на паузу после недели без обращений к базе.
# Открытие графика само по себе дёргает get_schedule, но на случай затишья
# (праздники, отпуска) этот запуск раз в сутки держит базу активной.
# Ключ в файле — публичный anon-ключ: он не даёт писать в базу, проверка
# пароля живёт внутри RPC save_schedule.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call get_schedule
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST https://udxvjrnfvfkrkupsczzg.supabase.co/rest/v1/rpc/get_schedule \
            -H 'apikey: sb_publishable_J9A_stjFoYrBtPdOVuNkVA_f50jv88-' \
            -H 'Authorization: Bearer sb_publishable_J9A_stjFoYrBtPdOVuNkVA_f50jv88-' \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "get_schedule -> $code"
          test "$code" = "200"
